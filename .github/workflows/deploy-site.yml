name: Deploy site

# Deploys live-site/content whenever it changes on main, without going through
# the paid Claude API refresh step in refresh-contests.yml. Lets a manual data
# fix (or edit to the site itself) go live immediately on push.
on:
  push:
    branches: [main]
    paths:
      - "live-site/content/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "live-site/content"
          output_location: ""
          skip_app_build: true
