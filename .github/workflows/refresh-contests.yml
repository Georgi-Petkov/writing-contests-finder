name: Refresh contest data

on:
  schedule:
    # TEMPORARY: one-off test trigger at 10:43 UTC on 2026-08-17 to verify the
    # Anthropic credit top-up fixed the automated refresh. Revert to the
    # regular weekly schedule after this fires.
    - cron: "43 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh contest data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_contests.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contests.json live-site/content/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly contest refresh"
            git push
          fi

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "live-site/content"
          output_location: ""
          skip_app_build: true
